name: Deploy PWA zu GitHub Pages

# Deployt die statische PWA. Läuft nach dem Merge auf main und kann für eine
# Vorschau auch manuell bzw. auf dem Feature-Branch ausgelöst werden.
on:
  push:
    branches:
      - main
      - claude/baby-sleep-tracker-pwa-jpuve6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende abbrechen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pages konfigurieren (aktiviert Pages automatisch)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakt hochladen (kompletter Projektordner)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
